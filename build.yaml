  - Group settings are split into Access and Features, Preferences and Account Rules, with Playback and Display apart and the old Other settings under Profile
  - Session cleanup rules are Base Repeater cards with a client picker
  - Each invite is a card with its name and status badge, its group, uses, expiration and PIN, and its full link with a QR code that opens to copy or download, and selecting a card opens its link, QR code, expiration and state in a dialog
  - Pending resets are a Base Record List, and each code sits in a masked copy field with an eye that shows it
  - Invite and reset state tags are colored by state, such as green for Active and orange for Expired
  - The count cards are compact, and the Invites and Pending Resets lists sit in fixed sections
  - The signup page shows resource links as the status card's buttons
  - Every Save is the same full width Save Bar, with any other actions in a full width row above it
  - Device Access lists each device on its own row with its app and last user, in a list you can search
