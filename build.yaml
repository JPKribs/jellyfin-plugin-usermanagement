changelog:
  changed:
  - Each invite is a card with its name and status badge, its group, uses, expiration and PIN, and its full link with a QR code that opens to copy or download
  - Selecting an invite card opens its editor, with the full QR code beside its link, its expiration and state, and Delete, Duplicate, Cancel and Save at the bottom
  - A refused signup shows on the signup page's red error line, and the resource links stack full width under it
  - The Groups, Invites and Resets tabs use the Base buttons, count cards, badges and sections
  - Group tags, access schedules and the media library order use the Base Tag Input, Access Schedule and Ordered List
  - Invite resources are rows of a title and a URL, edited in place
  - Group names are entered in a prompt, and deleting a group or an invite asks first in a dialog
  - Each group setting is its own bordered row, with Member and Group pills beside its name, and its controls show only while the group sets it
  - Group sections read like Jellyfin's user pages, and each section header counts the settings the group sets
  - Library, channel and device access and media deletion show a searchable list under their "all" checkbox only while it is off, and the home screen library rows are searchable lists too
  - Group channel access can pick single channels
  - Group settings are split into Access and Features, Preferences and Account Rules, with Playback and Display apart and the old Other settings under Profile
  - Session cleanup rules are Base Repeater cards with a client picker
  - Pending resets are a Base Record List, and each code sits in a masked copy field with an eye that shows it
  - Invite and reset state tags are colored by state, such as green for Active and orange for Expired
  - The count cards are compact, and the Invites and Pending Resets lists sit in fixed sections
  - The signup page shows resource links as the status card's buttons
  - Every Save is the same full width Save Bar, with any other actions in a full width row above it
  - Device Access lists each device on its own row with its app and last user, in a list you can search
  developer:
  - Uses JPKribs.Jellyfin.Base 2026.11.20, with the dashboard pages and the signup page on its base- classes, and its Record List tag colors, wrapped inline Copy Field, checkbox safe inputContainer and Editor Dialog footer actions in place of local code
  - The repository guides live in starthere.md, agent.md and skills/
  - tools/screenshots takes the Groups and Invites docs screenshots from the plugin's own pages with generic sample data
